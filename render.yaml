services:
  - type: web
    name: smartmart
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartmart-db
          property: connectionString
      - key: STORE_NAME
        value: SmartMart
      - key: STORE_ADDRESS
        value: Kampala, Uganda
      - key: STORE_PHONE
        value: +256 700 000 000
      - key: STORE_TAX_RATE
        value: "0"
      - key: CURRENCY
        value: UGX
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: smartmart-db
    databaseName: smartmart
    user: smartmart
